name: build uxplay-windows ARM64

on:
  push:
    branches:
      - arm64
  pull_request:
    branches:
      - arm64
  workflow_dispatch:

concurrency:
  group: arm64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build, bundle and test ARM64
    runs-on: windows-11-arm
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    permissions:
      contents: read

    steps:
      - name: preserve shell script line endings
        shell: powershell
        run: git config --global core.autocrlf input

      - name: check out repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: restore Bonjour SDK cache
        uses: actions/cache@v5
        with:
          path: Bonjour SDK
          key: bonjour-arm64-2881-${{ hashFiles('mdnsresponder-patches/2881.patch', 'scripts/build-bonjour-arm64.ps1') }}-v1

      - name: set up MSYS2 CLANGARM64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          cache: true

      - name: set up native Windows Python for WinRT
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          architecture: arm64
          cache: pip
          cache-dependency-path: packaging/python-requirements-arm64.txt

      - name: set up .NET SDK for WiX
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: restore Pacman package archives
        uses: actions/cache@v5
        with:
          path: C:\msys64\var\cache\pacman\pkg
          key: pacman-clangarm64-${{ runner.os }}-${{ hashFiles('clangarm64_dependencies.txt') }}-v1
          restore-keys: |
            pacman-clangarm64-${{ runner.os }}-

      - name: restore WiX NuGet cache
        uses: actions/cache@v5
        with:
          path: out/arm64/nuget-packages
          key: wix-arm64-${{ runner.os }}-${{ hashFiles('.config/dotnet-tools.json', 'NuGet.config') }}-v1

      - name: build, bundle and verify
        shell: powershell
        run: .\build.ps1 package

      - name: upload ARM64 artifacts
        uses: actions/upload-artifact@v5
        with:
          name: uxplay-windows-arm64
          path: out/arm64/artifacts/*
          if-no-files-found: error

name: build uxplay-windows x64

on:
  push:
    branches:
      - x64
  pull_request:
    branches:
      - x64
  workflow_dispatch:

concurrency:
  group: x64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build, bundle and test x64
    runs-on: windows-2022
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    permissions:
      contents: read

    steps:
      - name: preserve shell script line endings
        shell: powershell
        run: git config --global core.autocrlf input

      - name: check out repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: restore Bonjour SDK cache
        uses: actions/cache@v5
        with:
          path: Bonjour SDK
          key: bonjour-x64-2881-${{ hashFiles('mdnsresponder-patches/2881.patch', 'scripts/build-bonjour-x64.ps1') }}-v1

      - name: set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true

      - name: set up native Windows Python for WinRT
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/python-requirements-x64.txt

      - name: set up .NET SDK for WiX
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: restore Pacman package archives
        uses: actions/cache@v5
        with:
          path: C:\msys64\var\cache\pacman\pkg
          key: pacman-ucrt64-${{ runner.os }}-${{ hashFiles('ucrt_x64_dependencies.txt') }}-v1
          restore-keys: |
            pacman-ucrt64-${{ runner.os }}-

      - name: restore WiX NuGet cache
        uses: actions/cache@v5
        with:
          path: out/x64/nuget-packages
          key: wix-${{ runner.os }}-${{ hashFiles('.config/dotnet-tools.json', 'NuGet.config') }}-v4

      - name: build, bundle and verify
        shell: powershell
        run: .\build.ps1 package

      - name: upload x64 artifacts
        uses: actions/upload-artifact@v5
        with:
          name: uxplay-windows-x64
          path: out/x64/artifacts/*
          if-no-files-found: error
